<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1007" width="880" height="1007" role="img" aria-label="Terminal-style audit report of Eduardo Dini, a senior PHP and WordPress developer since 2012 who now builds LLM agents and is open to remote roles" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;font-size:14px;fill:#D5DCEA}
.b{font-weight:700}
.ln{animation:in .25s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.type{animation:type 1.3s steps(37) .4s both}
@keyframes type{from{transform:translateX(-330px)}to{transform:none}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fill{animation:grow .9s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.ln,.type,.fill{animation:none}}
</style>
<clipPath id="c"><rect width="880" height="1007" rx="14"/></clipPath>
<g clip-path="url(#c)">
<rect width="880" height="1007" fill="#141C2F"/>
<rect width="880" height="40" fill="#1E2842"/>
<circle cx="24" cy="20" r="6" fill="#FF7A70"/><circle cx="44" cy="20" r="6" fill="#F3B94F"/><circle cx="64" cy="20" r="6" fill="#7FD7A4"/>
<text x="440.0" y="25" text-anchor="middle" style="fill:#7483A3;font-size:13px">~/dujudini</text>

<text x="34" y="74"><tspan style="fill:#B79CFF">$ </tspan>audit-agent audit github.com/dujudini</text>
<rect class="type" x="52" y="58" width="330" height="22" fill="#141C2F" transform="translate(330 0)"/>
<g class="ln" style="animation-delay:1.90s"><text x="34" y="120"><tspan class="b"># Audit report: Eduardo Dini</tspan><tspan dx="24" style="fill:#7FD7A4">✓ 6 checks passed, 0 issues</tspan></text></g>
<g class="ln" style="animation-delay:2.05s"><text x="34" y="143" style="fill:#F3B94F">note: <tspan style="fill:#7483A3">most of my production code sits in private client repos. Ask me for a walkthrough.</tspan></text></g>
<g class="ln" style="animation-delay:2.20s"><rect x="34" y="174" width="92" height="21" rx="5" fill="#FF7A70"/><text x="80" y="189" text-anchor="middle" class="b" style="fill:#141C2F;font-size:12.5px">BACKEND</text><text x="140" y="189" class="b">PHP, WordPress and API development since 2012</text></g>
<g class="ln" style="animation-delay:2.35s"><text x="56" y="212" style="fill:#D5DCEA">REST and GraphQL APIs, from architecture to third-party integrations</text></g>
<g class="ln" style="animation-delay:2.50s"><text x="56" y="235" style="fill:#D5DCEA">Custom e-commerce and internal management systems</text></g>
<g class="ln" style="animation-delay:2.65s"><text x="56" y="258" style="fill:#D5DCEA">Clients of 10+ years: Music Video Festival, Station Film, Cia. Lazer</text></g>
<g class="ln" style="animation-delay:2.80s"><text x="56" y="281" style="fill:#D5DCEA">Also built for Prefeitura de São Paulo, Instituto Alana, Lew'Lara\TBWA</text></g>
<g class="ln" style="animation-delay:2.95s"><text x="56" y="304" style="fill:#7483A3">evidence: dujudini.com.br, 14 years in production</text></g>
<g class="ln" style="animation-delay:3.10s"><rect x="34" y="335" width="92" height="21" rx="5" fill="#B79CFF"/><text x="80" y="350" text-anchor="middle" class="b" style="fill:#141C2F;font-size:12.5px">AI</text><text x="140" y="350" class="b">I build LLM agents that audit live websites</text></g>
<g class="ln" style="animation-delay:3.25s"><text x="56" y="373" style="fill:#D5DCEA">Hand-written agent loop, evals replayed from recorded cassettes.</text></g>
<g class="ln" style="animation-delay:3.40s"><text x="56" y="396" style="fill:#D5DCEA">Each finding cites the tool call that produced it.</text></g>
<g class="ln" style="animation-delay:3.55s"><text x="56" y="419" style="fill:#7483A3">recall</text><rect x="236" y="408" width="300" height="12" rx="3" fill="#1E2842"/><rect class="fill" style="animation-delay:3.75s" x="236" y="408" width="300" height="12" rx="3" fill="#7FD7A4"/><text x="550" y="419" class="b" style="fill:#7FD7A4">8/8</text></g>
<g class="ln" style="animation-delay:3.70s"><text x="56" y="442" style="fill:#7483A3">evidence integrity</text><rect x="236" y="431" width="300" height="12" rx="3" fill="#1E2842"/><rect class="fill" style="animation-delay:3.90s" x="236" y="431" width="300" height="12" rx="3" fill="#7FD7A4"/><text x="550" y="442" class="b" style="fill:#7FD7A4">36/36</text></g>
<g class="ln" style="animation-delay:3.85s"><text x="56" y="465" style="fill:#7483A3">evidence: site-audit-agent, portugues-natural</text></g>
<g class="ln" style="animation-delay:4.00s"><rect x="34" y="496" width="92" height="21" rx="5" fill="#F3B94F"/><text x="80" y="511" text-anchor="middle" class="b" style="fill:#141C2F;font-size:12.5px">DEVOPS</text><text x="140" y="511" class="b">I run the servers</text></g>
<g class="ln" style="animation-delay:4.15s"><text x="56" y="534" style="fill:#D5DCEA">Git and CI/CD with GitHub Actions on AWS (EC2, Apache, PHP-FPM, MariaDB)</text></g>
<g class="ln" style="animation-delay:4.30s"><text x="56" y="557" style="fill:#D5DCEA">Cloudflare DDoS mitigation and Zero Trust</text></g>
<g class="ln" style="animation-delay:4.45s"><text x="56" y="580" style="fill:#7FD7A4">→ trust me with the server at 3 a.m.</text></g>
<g class="ln" style="animation-delay:4.60s"><text x="56" y="603" style="fill:#7483A3">evidence: 14 years of uptime</text></g>
<g class="ln" style="animation-delay:4.75s"><rect x="34" y="634" width="92" height="21" rx="5" fill="#5FD4C4"/><text x="80" y="649" text-anchor="middle" class="b" style="fill:#141C2F;font-size:12.5px">STANDARDS</text><text x="140" y="649" class="b">Accessibility, privacy and payment compliance</text></g>
<g class="ln" style="animation-delay:4.90s"><text x="56" y="672" style="fill:#D5DCEA">Web accessibility to WCAG 2.2</text></g>
<g class="ln" style="animation-delay:5.05s"><text x="56" y="695" style="fill:#D5DCEA">Data privacy under LGPD (Brazil's GDPR) and PCI DSS for payments</text></g>
<g class="ln" style="animation-delay:5.20s"><text x="56" y="718" style="fill:#7483A3">evidence: Cia. Lazer LGPD data deletion protocol</text></g>
<g class="ln" style="animation-delay:5.35s"><rect x="34" y="749" width="92" height="21" rx="5" fill="#71B7FF"/><text x="80" y="764" text-anchor="middle" class="b" style="fill:#141C2F;font-size:12.5px">MOBILE</text><text x="140" y="764" class="b">I ship to the App Store and Google Play</text></g>
<g class="ln" style="animation-delay:5.50s"><text x="56" y="787" style="fill:#D5DCEA">Cia. Lazer app, built in React Native/Expo</text></g>
<g class="ln" style="animation-delay:5.65s"><text x="56" y="810" style="fill:#7483A3">evidence: Cia Lazer app</text></g>
<g class="ln" style="animation-delay:5.80s"><rect x="34" y="841" width="92" height="21" rx="5" fill="#7FD7A4"/><text x="80" y="856" text-anchor="middle" class="b" style="fill:#141C2F;font-size:12.5px">HIRE</text><text x="140" y="856" class="b">Available for remote work</text></g>
<g class="ln" style="animation-delay:5.95s"><text x="56" y="879" style="fill:#D5DCEA">Senior PHP / WordPress roles, AI Engineer / Applied AI roles</text></g>
<g class="ln" style="animation-delay:6.10s"><text x="56" y="902" style="fill:#D5DCEA">São Paulo, UTC-3, overlaps the US workday</text></g>
<g class="ln" style="animation-delay:6.25s"><text x="56" y="925" style="fill:#7FD7A4">→ eduardo@dujudini.com.br</text></g>
<g class="ln" style="animation-delay:6.40s"><text x="34" y="971" style="fill:#7483A3">cost: <tspan style="fill:#D5DCEA">14 years</tspan><tspan dx="22">iterations: </tspan><tspan style="fill:#D5DCEA">plenty</tspan><tspan dx="22">coffee: </tspan><tspan style="fill:#D5DCEA">not tracked</tspan><tspan dx="8" class="cur" style="fill:#D5DCEA">█</tspan></text></g>
</g></svg>